name: New round

# Rounds start at 00:00, 06:00, 12:00 and 18:00 Singapore time (16, 22, 04, 10 UTC) and are
# scored on NEA's reading stamped at that time, which averages the hour before. So the job
# starts 50, 35 and 20 minutes before each round: it photographs that hour, waits for the
# reading, then publishes. GitHub's scheduler can run late, hence three tries; once a
# round is live, later runs for it just reuse it.
on:
  schedule:
    - cron: "10,25,40 3,9,15,21 * * *"
    # Catch-up runs 10 and 30 min after each round starts, in case every earlier run
    # failed. They do nothing if the round is already live; otherwise they rebuild it from
    # LTA's photo history for that hour (live-only cameras sit out) and the same reading.
    - cron: "10,30 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retake photos even if this round is already live"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take snapshots
        # A code push redeploys the live round as is; a manual run with force retakes it.
        run: node scripts/snapshot.mjs ${{ github.event_name == 'push' && '--redeploy' || '' }} ${{ inputs.force && '--force' || '' }}
      - name: Save answer history
        run: |
          if ! git diff --quiet -- data/history.json; then
            git config user.name "hazedle-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Round answers $(date -u +%FT%H:%MZ)"
            git pull --rebase && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
