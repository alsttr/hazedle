name: New round

# Rounds start at 00:00, 06:00, 12:00 and 18:00 Singapore time and are scored on NEA's
# reading stamped at that time, which averages the hour before. Photos must come from
# that hour, and two cameras (Changi, Midview) only ever show "now", so the photos have
# to be taken on time.
#
# GitHub often starts scheduled runs late (2 hours late on 18 Oct 2026), so this wakes
# every 30 minutes. A run within 5 hours of the next round stays running: it waits for the
# photo hour, takes the photos, waits for NEA's reading and publishes. Other runs queue
# behind it and exit once that round is live. If every run somehow missed a round, the
# first one in the 45 minutes after it starts rebuilds it from LTA's photo history.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retake the nearest round's photos now, even if it's already live"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: round
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: snap
        name: Take snapshots
        run: node scripts/snapshot.mjs ${{ inputs.force && '--force' || '' }}
      - name: Save answer history
        if: steps.snap.outputs.publish == 'true'
        run: |
          if ! git diff --quiet -- data/history.json; then
            git config user.name "hazedle-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Round answers $(date -u +%FT%H:%MZ)"
            git pull --rebase && git push
          fi
      - if: steps.snap.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.snap.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.snap.outputs.publish == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
