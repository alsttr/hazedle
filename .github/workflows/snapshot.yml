name: New round

# A round starts at 00:00, 06:00, 12:00 and 18:00 Singapore time (16, 22, 04, 10 UTC).
# GitHub's scheduler can run late, so each slot is tried three times; once a round
# is live, later runs in the same slot just reuse it.
on:
  schedule:
    - cron: "1,20,40 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retake photos even if this round is already live"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take snapshots
        run: node scripts/snapshot.mjs ${{ inputs.force && '--force' || '' }}
      - name: Save answer history
        run: |
          if ! git diff --quiet -- data/history.json; then
            git config user.name "hazedle-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Round answers $(date -u +%FT%H:%MZ)"
            git pull --rebase && git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
