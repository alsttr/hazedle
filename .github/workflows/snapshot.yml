name: New round

# Rounds start at 12am, 8am, 12pm and 6pm Singapore time and are scored on NEA's reading
# stamped at that time, which averages the hour before. Photos must come from that hour,
# and two cameras (Changi, Midview) only show "now", so the photos have to be taken on time.
#
# GitHub's schedule can't be trusted for that (it ran 2 h late, then skipped 6 h), so each
# run starts the next one before it ends, keeping one run always waiting for the next round.
# A run within 5 h of the next round waits for the photo hour, takes the photos, waits for
# NEA's reading and publishes; one further out sleeps until it's within 5 h, then hands over.
# The schedule below only restarts the chain if it ever breaks.
on:
  schedule:
    - cron: "7,37 * * * *" # backup only; the chain above does the real work
  workflow_dispatch:
    inputs:
      force:
        description: "Retake the nearest round's photos now, even if it's already live"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: round
  cancel-in-progress: false

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: snap
        name: Take snapshots
        run: node scripts/snapshot.mjs ${{ inputs.force && '--force' || '' }}
      - name: Save answer history
        if: steps.snap.outputs.publish == 'true'
        run: |
          if ! git diff --quiet -- data/history.json; then
            git config user.name "hazedle-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/history.json
            git commit -m "Round answers $(date -u +%FT%H:%MZ)"
            git pull --rebase && git push
          fi
      - if: steps.snap.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.snap.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.snap.outputs.publish == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # After a failure, pause so a persistent error can't spin runs back to back.
          if [ "${{ job.status }}" != "success" ]; then sleep 300; fi
          gh workflow run snapshot.yml --repo "${{ github.repository }}"
